name: Deploy Pico to GitHub Pages

on:
  push:
    branches: [main, cursor/pico-web-mvp-17e0]
    paths:
      - '02-Projects/Pico/web/**'
      - '.github/workflows/deploy-pico.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pico-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02-Projects/Pico/web/package-lock.json

      - name: Install and build
        working-directory: 02-Projects/Pico/web
        env:
          VITE_BASE: /cos/
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 02-Projects/Pico/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
